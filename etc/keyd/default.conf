[ids]
*

[global]
overload_tap_timeout = 250

[main]
# 1. Remap CapsLock to:
#    - Tap  -> Escape
#    - Hold -> Meta (The "Super" or "Windows" key)
capslock = overload(meta, esc)

# Remap physical Esc to CapsLock (swap them)
# esc = capslock

# Japanese keyboard ergonomic remappings
henkan = backspace
katakanahiragana = capslock
yen = compose
ro = layer(shift)

# Hold henkan to activate the custom "nav" layer
muhenkan = layer(nav)

[nav]
# Define what keys do while holding henkan
h = left
j = down
k = up
l = right
u = pageup
d = pagedown

# [shift]
# 2. This makes "Shift + CapsLock" trigger the REAL CapsLock toggle
# capslock = capslock
